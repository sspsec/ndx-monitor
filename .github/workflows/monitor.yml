name: Index ETF monitor

on:
  # GitHub Actions 使用 UTC。22:30 UTC = 北京时间次日 06:30，覆盖美股收盘后的最新日线。
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "发送一条 Telegram/邮件测试通知"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  monitor:
    name: ${{ matrix.market_name }}监控
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: ndx
            market_name: NDQ 纳斯达克100
          - market: sp500
            market_name: SP500 标普500
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check index and notify
        env:
          MARKET: ${{ matrix.market }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python monitor.py
